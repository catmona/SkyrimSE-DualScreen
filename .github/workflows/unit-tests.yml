name: Unit tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Unit tests
        run: ./gradlew :app:testModernDebugUnitTest --continue --console=plain
      - name: Failed test classes
        if: failure()
        run: grep -lE "<(failure|error)[ >]" app/build/test-results/testModernDebugUnitTest/*.xml | xargs -r -n1 basename || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/test-results/testModernDebugUnitTest/*.xml
          if-no-files-found: ignore
