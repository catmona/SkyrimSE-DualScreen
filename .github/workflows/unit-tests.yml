name: Unit tests
on:
  push:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Unit tests
        run: ./gradlew :app:testModernDebugUnitTest --continue --console=plain
      - name: Failures
        if: always()
        run: grep -l "<failure" app/build/test-results/testModernDebugUnitTest/*.xml | xargs -r -n1 basename || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/test-results/testModernDebugUnitTest/*.xml
